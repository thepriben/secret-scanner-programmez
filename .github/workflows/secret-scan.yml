name: Détection de secrets

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer la chaîne Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compiler le scanner
        run: cargo build --release --locked

      - name: Analyser le dépôt
        run: ./target/release/secret-scan .

      - name: Produire le rapport JSON
        if: failure()
        run: ./target/release/secret-scan --json . > rapport-secrets.json || true

      - name: Publier le rapport
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-secrets
          path: rapport-secrets.json
